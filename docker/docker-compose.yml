services:
  eureka-service:
    build:
      context: ../eureka-service
      dockerfile: Dockerfile
    image: eureka-service:local
    container_name: eureka-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: "8761"
      EUREKA_HOSTNAME: eureka-service
    ports:
      - "${EUREKA_BIND_IP:-127.0.0.1}:${EUREKA_HOST_PORT:-8761}:8761"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8761/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - microservices-network

  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    image: api-gateway:local
    container_name: api-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://${EUREKA_USERNAME:-admin}:${EUREKA_PASSWORD:-}@eureka-service:8761/eureka/}
    ports:
      - "${GATEWAY_BIND_IP:-127.0.0.1}:${GATEWAY_HOST_PORT:-8080}:8080"
    depends_on:
      eureka-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - microservices-network

networks:
  microservices-network:
    name: microservices-network
    driver: bridge
