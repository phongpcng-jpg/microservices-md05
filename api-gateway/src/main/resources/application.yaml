server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URI:lb://user-service}
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=1
            - id: product-service
              uri: ${PRODUCT_SERVICE_URI:lb://product-service}
              predicates:
                - Path=/api/products/**
              filters:
                - StripPrefix=1
            - id: cart-service
              uri: ${CART_SERVICE_URI:lb://cart-service}
              predicates:
                - Path=/api/carts/**
              filters:
                - StripPrefix=1

eureka:
  client:
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: false

info:
  app:
    name: ${spring.application.name}
    description: API Gateway for the microservices platform
