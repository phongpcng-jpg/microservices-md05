name: API Gateway CI

on:
  push:
    branches:
      - main
    paths:
      - "api-gateway/**"
      - ".github/workflows/gateway-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "api-gateway/**"
      - ".github/workflows/gateway-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The workflow is added before the service scaffold. Skip cleanly until
    # api-gateway/gradlew exists; subsequent service commits will run this job.
    if: ${{ hashFiles('api-gateway/gradlew') != '' }}
    name: Build and test API Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api-gateway
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build application
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean test bootJar

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-test-reports
          path: api-gateway/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload executable JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-boot-jar
          path: api-gateway/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
