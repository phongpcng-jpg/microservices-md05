name: Eureka Service CI

on:
  push:
    branches:
      - main
    paths:
      - "eureka-service/**"
      - "docker/**"
      - ".github/workflows/eureka-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "eureka-service/**"
      - "docker/**"
      - ".github/workflows/eureka-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eureka-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Eureka Service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: eureka-service
    env:
      SERVER_PORT: 8761
      EUREKA_HOSTNAME: localhost
      EUREKA_USERNAME: ci-admin
      EUREKA_PASSWORD: ci-only-password
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build application
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean test bootJar

      - name: Validate root Docker Compose configuration
        run: |
          cp ../docker/.env.example ../docker/.env
          docker compose -f ../docker/docker-compose.yml config --quiet

      - name: Build Eureka Docker image through root Compose
        run: docker compose -f ../docker/docker-compose.yml build eureka-service

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eureka-service-test-reports
          path: eureka-service/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload executable JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eureka-service-boot-jar
          path: eureka-service/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
