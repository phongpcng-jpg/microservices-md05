name: Eureka Service CI

on:
  push:
    branches:
      - main
    paths:
      - "eureka-service/**"
      - ".github/workflows/eureka-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "eureka-service/**"
      - ".github/workflows/eureka-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eureka-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Eureka Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eureka-service
    env:
      SERVER_PORT: 8761
      EUREKA_HOSTNAME: localhost
      EUREKA_USERNAME: ci-admin
      EUREKA_PASSWORD: ci-only-password
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and build application
        run: ./gradlew --no-daemon clean test bootJar
